name: YuyueAssistant
options:
  bundleIdPrefix: com.kk521.yuyue
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true

targets:
  YuyueAssistant:
    type: application
    platform: iOS
    sources:
      - path: YuyueAssistant
        excludes:
          - "Resources/**"
          - "Info.plist"
      # Assets.xcassets 必须走 sources 才会被 actool 编进 Assets.car；
      # 放在 resources 里会被当成普通文件处理，产不出 Assets.car。
      - path: YuyueAssistant/Resources/Assets.xcassets
    resources:
      - path: YuyueAssistant/Resources/www
        type: folder
        buildPhase: resources
      - path: YuyueAssistant/Resources/gallery
        type: folder
        buildPhase: resources
      - path: YuyueAssistant/Resources/Icon.png
      - path: YuyueAssistant/Resources/Icon-120.png
      - path: YuyueAssistant/Resources/Icon-152.png
      - path: YuyueAssistant/Resources/Icon-167.png
    # 注意：这里不能写 info: {path: ...}。XcodeGen 会用自动生成的空壳 plist
    # 覆盖掉仓库里手写的 Info.plist，导致 CFBundleDisplayName / CFBundleIconFile /
    # UILaunchScreen 等自定义键全部丢失。改用下面的 INFOPLIST_FILE 直接消费现成文件。
    entitlements:
      path: Entitlements.plist
    settings:
      base:
        PRODUCT_NAME: YuyueAssistant
        PRODUCT_BUNDLE_IDENTIFIER: com.kk521.yuyue.assistant
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        INFOPLIST_FILE: YuyueAssistant/Info.plist

schemes:
  YuyueAssistant:
    build:
      targets:
        YuyueAssistant: all
    run:
      config: Release
    archive:
      config: Release
